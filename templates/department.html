{% extends 'base.html' %}
{% block title %}Department{% endblock %}

{% block content %}
{% load static %}

<style>
  body {
    background-color: #f8fafc;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
  }
  .section-title {
    position: relative;
    font-weight: 800;
    color: #0f172a;
    letter-spacing: -0.5px;
  }
  .section-title::after {
    content: '';
    display: block;
    width: 60px;
    height: 4px;
    background: linear-gradient(135deg, #0d6efd, #0dcaf0);
    margin: 1rem auto 0;
    border-radius: 2px;
  }
  .custom-dept-card {
    border: 1px solid rgba(0, 0, 0, 0.06) !important;
    border-radius: 18px !important;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    background: #ffffff;
  }
  .custom-dept-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 20px 40px rgba(13, 110, 253, 0.15);
    border-color: rgba(13, 110, 253, 0.3) !important;
  }
  .sticker-wrapper {
    width: 65px;
    height: 65px;
    background: #f1f5f9;
    border-radius: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    transition: all 0.4s ease;
  }
  .custom-dept-card:hover .sticker-wrapper {
    background: linear-gradient(135deg, #0d6efd, #0dcaf0);
    transform: scale(1.12) rotate(6deg);
    box-shadow: 0 8px 20px rgba(13, 202, 240, 0.3);
  }
  .custom-dept-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 4px;
    background: linear-gradient(90deg, #0d6efd, #0dcaf0);
    border-radius: 18px 18px 0 0;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .custom-dept-card:hover::before {
    opacity: 1;
  }
</style>

<div class="container py-5">
  <div class="row text-center mb-5">
    <div class="col">
      <h1 class="display-5 section-title fw-bold">Our Departments</h1>
      <p class="text-muted mt-3">Providing world-class medical expertise with cutting-edge facilities.</p>
    </div>
  </div>

  <div class="row g-4">
    {% for d in dep_info %}
    <div class="col-12 col-md-6 col-lg-4">
      <div class="card h-100 p-4 custom-dept-card position-relative overflow-hidden">
        <div class="card-body p-0 d-flex flex-column align-items-start">
          
          <div class="sticker-wrapper mb-3" data-dept-name="{{ d.d_name }}">🩺</div>
          
          <h3 class="h5 card-title fw-bold text-dark mb-2">{{ d.d_name }}</h3>
          <p class="card-text text-muted small">{{ d.d_disc }}</p>
          
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const stickerMap = {
      "general surgery": "🩻",
      "orthopedics": "🦴",
      "neurology": "🧠",
      "cardiology": "❤️‍🩹",
      "intensive care unit": "🩺",
      "icu": "🩺",
      "housekeeping & maintenance": "✨",
      "housekeeping": "✨",
      "clinical laboratory & pathology": "🔬",
      "clinical lab": "🔬",
      "central sterile supply": "🧼",
      "emergency": "🚨"
    };

    document.querySelectorAll('.sticker-wrapper').forEach(wrapper => {
      const deptName = wrapper.getAttribute('data-dept-name').toLowerCase().trim();
      
      // Look for a matching keyword in your department name
      for (const [key, sticker] of Object.entries(stickerMap)) {
        if (deptName.includes(key)) {
          wrapper.textContent = sticker;
          break;
        }
      }
    });
  });
</script>
{% endblock %}
