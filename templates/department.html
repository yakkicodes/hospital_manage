{% extends 'base.html'%}
{% block title%}
Department
{% endblock %}
{% block content %}
<h1 class=" text-center fs-1 font-weight-bold " style="width: 100%; height: 100%;">Our Departments</h1>
{% for d in dep_info %}


{% load static %}
<div>
    <div class="department-container " class="card mb-3" style="max-width: 540px; margin: auto; background-color: #eef1f5; border-radius: 10px; box-shadow: 0px 4px 8px  rgba(39, 39, 39, 0.1); padding: 20px; margin-bottom: 20px; transition: transform 0.3s ease; ">
        <h1 id="department">{{ d.d_name }}</h1>
        <p id="parag">{{ d.d_disc }}</p>
    </div>
    <br>
</div>


{% endfor %}
{% endblock %}
